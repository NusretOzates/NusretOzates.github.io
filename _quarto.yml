project:
  type: website
  output-dir: docs

website:
  search: true
  title: "Nusret Özateş"
  site-url: https://nusretozates.github.io/
  description: "Welcome to Nusret Ozates's personal website. Explore my projects, blogs, and more!"
  google-analytics:
    tracking-id: "G-FVW7859HWV"
    storage: none
    anonymize-ip: true
  navbar:
    background: dark
    right:
      - icon: github
        href: https://github.com/NusretOzates
    left:
      - text: Home
        href: index.qmd
      - text: Blogs
        href: myposts.qmd
      - text: Talks
        href: talks.qmd
      - text: Videos
        href: videos.qmd
      - text: Notes
        href: notes.qmd

format:
  html:
    respect-user-color-scheme: true
    smooth-scroll: true
    theme:
      light: cosmo
      dark: superhero
    css: styles.css
    fontsize: 1.1rem
    linestretch: 1.6
    mainfont: "'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    monofont: "'JetBrains Mono', 'Fira Code', Consolas, monospace"
    include-in-header:
      - text: |
          <link rel="icon" href="/favicon.png" type="image/png">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
