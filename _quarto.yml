project:
  type: website
  output-dir: docs

website:
  search: true
  title: "Nusret Ozates"
  site-url: https://nusretozates.github.io/
  description: "Welcome to Nusret Ozates's personal website. Explore my projects, blogs, and more!"
  google-analytics:
    tracking-id: "G-FVW7859HWV"
    storage: none
    anonymize-ip: true
  navbar:
    background: dark
    right:
      - icon: github
        href: https://github.com/NusretOzates
      - icon: twitter
        href: https://twitter.com
    left:
      - text: Blogs
        href: myposts.qmd
      - text: Notes
        href: notes.qmd

format:
  html:
    respect-user-color-scheme: true
    smooth-scroll: true
    theme:
      light: cosmo
      dark: superhero
    css: styles.css
    fontsize: 1.1rem
    linestretch: 1.6
    mainfont: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">


