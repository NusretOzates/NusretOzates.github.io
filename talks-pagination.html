<script>
(() => {
  const listingSelector = "#listing-talks-listing";

  document.addEventListener(
    "click",
    (event) => {
      const link = event.target.closest(
        `${listingSelector} .listing-pagination a.page-link`
      );
      if (!link) return;

      // List.js / Quarto use href="#", which jumps to the page top.
      event.preventDefault();

      requestAnimationFrame(() => {
        document
          .querySelector(listingSelector)
          ?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    },
    true
  );
})();
</script>
